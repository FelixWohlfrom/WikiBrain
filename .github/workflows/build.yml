name: Build the brain

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: "Build and execute tests on different node versions"
    runs-on: ubuntu-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'

    - name: Verify build
      run: |
        npm ci
        npm run build
